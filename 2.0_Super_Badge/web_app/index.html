<!DOCTYPE html>
<html>
<head>
    <title>Super Badge Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #222; color: white; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:active { background: #45a049; }
        #logs { margin-top: 20px; font-family: monospace; color: #aaa; }
    </style>
</head>
<body>
    <h1>Super Badge BLE</h1>
    <button id="connectBtn">Connect to Badge</button>
    <br><br>
    <button id="homeBtn" style="display:none; background: #008CBA;">Home Screen</button>
    <button id="lockBtn" style="display:none; background: #f44336;">Lock Badge</button>

    <div id="logs"></div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        let rxCharacteristic;

        function log(msg) { document.getElementById('logs').innerText = msg + '\n' + document.getElementById('logs').innerText; }

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                log("Scanning...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'SuperBadge' }],
                    optionalServices: [SERVICE_UUID]
                });
                log("Connecting to " + device.name + "...");
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(RX_UUID);
                log("Connected Successfully!");
                
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('homeBtn').style.display = 'inline-block';
                document.getElementById('lockBtn').style.display = 'inline-block';
            } catch (err) { log("Error: " + err); }
        });

        async function sendCommand(cmd) {
            if (!rxCharacteristic) return;
            const payload = JSON.stringify({ cmd: cmd, args: {} }) + "\n";
            const encoder = new TextEncoder();
            await rxCharacteristic.writeValue(encoder.encode(payload));
            log("Sent: " + cmd);
        }

        document.getElementById('homeBtn').addEventListener('click', () => sendCommand('welcome'));
        document.getElementById('lockBtn').addEventListener('click', () => sendCommand('lock'));
    </script>
</body>
</html>
